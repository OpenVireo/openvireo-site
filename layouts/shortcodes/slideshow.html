{{- /* Scroll-snap carousel with Fluent buttons (replaces the UIkit slideshow). */ -}}
<div class="carousel"{{ if (.Get "autoplay" | default true) }} data-autoplay{{ end }}>
    <ul class="carousel-track"{{ if (.Get "lightbox" | default true) }} data-lightbox{{ end }} aria-label="Slideshow">
        {{- $items := split .Inner "\n- " -}}
        {{ range after 1 $items -}}
        <li>
            {{ . | safeHTML }}
        </li>
        {{ end }}
    </ul>
    <fluent-button class="carousel-nav prev js-only" shape="circular" size="large" icon-only aria-label="Previous slide">
        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
    </fluent-button>
    <fluent-button class="carousel-nav next js-only" shape="circular" size="large" icon-only aria-label="Next slide">
        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
    </fluent-button>
</div>
