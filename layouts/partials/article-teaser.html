<article class="card card-interactive article-teaser">
    <div class="card-header">
        <h2 class="card-title"><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
        {{ partial "article-meta.html" . }}
    </div>
    <div class="card-body text-small">
        {{ .Summary }}
        {{- if .Truncated }}<p><a href="{{ .Permalink }}">Read more<span class="visually-hidden"> about {{ .Title }}</span>&hellip;</a></p>{{ end }}
    </div>
</article>
