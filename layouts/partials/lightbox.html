<fluent-dialog id="lightbox" type="modal" aria-label="Image viewer">
    <figure>
        <fluent-button class="lightbox-close" shape="circular" icon-only aria-label="Close">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </fluent-button>
        <img src="data:," alt="">
        <fluent-button class="lightbox-nav prev" shape="circular" icon-only aria-label="Previous image">
            <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
        </fluent-button>
        <fluent-button class="lightbox-nav next" shape="circular" icon-only aria-label="Next image">
            <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
        </fluent-button>
        <figcaption></figcaption>
    </figure>
</fluent-dialog>
