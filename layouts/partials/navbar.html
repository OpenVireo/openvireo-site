{{- define "partials/nav-links.html" }}
    {{- $currentPage := . }}
    {{- range .Site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if or ($currentPage.HasMenuCurrent "main" .) ($currentPage.IsMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
    {{- end }}
{{- end }}

<header class="site-header">
    <div class="container header-inner">
        <a class="logo" href="{{ .Site.BaseURL }}">
            <img src="{{ .Site.BaseURL }}assets/img/keepassxc.svg" alt="" width="42" height="42">
            <span>KeePassXC</span>
        </a>

        <nav aria-label="Main" class="nav-links-wrapper">
            <ul class="nav-links">
                {{- partial "nav-links.html" . }}
            </ul>
        </nav>

        <div class="header-actions">
            <a class="btn btn-subtle btn-icon btn-large" href="https://github.com/keepassxreboot/keepassxc" aria-label="KeePassXC on GitHub" title="KeePassXC on GitHub">
                <i class="fa-brands fa-github" aria-hidden="true"></i>
            </a>
            <fluent-button class="nav-toggle js-only" appearance="subtle" size="large" icon-only aria-label="Open navigation" aria-controls="nav-drawer" aria-expanded="false">
                <i class="fa-solid fa-bars" aria-hidden="true"></i>
            </fluent-button>
        </div>
    </div>
</header>

<fluent-drawer id="nav-drawer" type="modal" position="end" size="small" aria-label="Main navigation">
    <fluent-drawer-body>
        <span slot="title">Menu</span>
        <fluent-button slot="close" appearance="transparent" icon-only aria-label="Close navigation">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </fluent-button>
        <nav aria-label="Main">
            <ul class="drawer-nav">
                {{- partial "nav-links.html" . }}
            </ul>
        </nav>
    </fluent-drawer-body>
</fluent-drawer>
