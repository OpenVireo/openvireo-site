<header class="article-meta">
    {{- if .Params.author }}
    <span class="text-nowrap">By <em class="p-author"><i class="ic ic-person-circle" aria-hidden="true"></i>{{ .Params.author }}</em></span>
    {{- end }}
    <span class="text-nowrap">Posted <time datetime="{{ .PublishDate.Format "2006-01-02T15:04:05-07:00" }}" class="dt-published"><i class="ic ic-clock" aria-hidden="true"></i>{{ .PublishDate.Format "2 January 2006, 15:04" }}</time></span>
    {{- if .Params.category }}
    <span class="text-nowrap">in <em class="blog-category"><i class="ic ic-tag-multiple" aria-hidden="true"></i>{{ .Params.category }}</em></span>
    {{- end }}
</header>
