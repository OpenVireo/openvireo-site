{{- if gt (len .Ancestors) 1 }}
<nav aria-label="Breadcrumb" class="breadcrumb">
    <ol>
        {{- range after 1 .Ancestors.Reverse }}
            <li><a href="{{ .Permalink }}">{{ .Title }}</a></li>
        {{- end }}
        <li aria-current="page">
            <a href="{{ .Permalink }}">{{ .Title }}</a>
        </li>
    </ol>
</nav>
{{ end }}
