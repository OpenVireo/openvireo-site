{{- /* Markdown guide pages: the same scrolling wrapper and styles as the Asciidoctor guides' tables */ -}}
<div class="table-wrap">
<table class="tableblock">
    <thead>
        {{- range .THead }}
        <tr>
            {{- range . }}
            <th{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</th>
            {{- end }}
        </tr>
        {{- end }}
    </thead>
    <tbody>
        {{- range .TBody }}
        <tr>
            {{- range . }}
            <td{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</td>
            {{- end }}
        </tr>
        {{- end }}
    </tbody>
</table>
</div>
