title = 'KeePassXC Password Manager'
baseURL = 'https://keepassxc.org'
locale = 'en-us'

[params]
# The KeePassXC web app (accounts and synced vaults); it takes /?view=signin|signup
# Override per build with HUGO_PARAMS_WEBAPPURL
webAppURL = 'https://app.keepassxc.org/'

[security]
# Hugo 0.168+ denies HTML content files by default; this site's pages are .html
allowContent = ['! ^text/org$']

[frontmatter]
date = ['publishDate', 'date', 'lastmod']
expiryDate = ['expiryDate']
lastmod = [':git', 'lastmod', 'date', 'publishDate']
publishDate = ['publishDate', 'date']

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
codeFences = true
guessSyntax = true
lineNoStart = 1
lineNos = true
lineNumbersInTable = false
tabWidth = 4
noClasses = true
style  = "nord"

[module]
  [[module.mounts]]
  source = "assets"
  target = "assets"

  [[module.mounts]]
  source = "node_modules/"
  target = "assets/node_modules"

  [[module.mounts]]
  source = "static"
  target = "static"

  [[module.mounts]]
  source = "node_modules/@fortawesome/fontawesome-free/webfonts"
  target = "static/assets/fonts/fontawesome"
