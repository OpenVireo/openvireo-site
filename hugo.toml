title = 'OpenVireo Password Manager'
baseURL = 'https://openvireo.com'
locale = 'en-us'

[params]
# Homepage <title> and the default meta description (pages without their own description)
homeTitle = 'OpenVireo: Open-Source, KeePass-Compatible Password Manager'
homeDescription = 'Free, open-source password manager that opens your KeePass (.kdbx) files. Sync across Windows, macOS, Linux, iPhone and the web, or self-host it.'
# The OpenVireo web app (OpenVireo Web) (accounts and synced vaults); it takes /?view=signin|signup
# Override per build with HUGO_PARAMS_WEBAPPURL
webAppURL = 'https://app.openvireo.com/'
# The account server's website (billing, account recovery). Override per build with HUGO_PARAMS_ACCOUNTSURL
accountsURL = 'https://accounts.openvireo.com/'
# Set to false once the browser extension is listed on Firefox Add-ons and the Chrome Web Store
extensionInReview = false

# Header nav entries that aren't pages on this site (pages add themselves with menu.main in their front matter)
[[menus.main]]
# The developer docs (SDK, ov CLI, core bindings, self-hosting the sync server); they moved off /docs/
name = 'Developers'
url = 'https://developer.openvireo.com/'
weight = 6

[security]
# Hugo 0.168+ denies HTML content files by default; this site's pages are .html
allowContent = ['! ^text/org$']

[frontmatter]
date = ['publishDate', 'date', 'lastmod']
expiryDate = ['expiryDate']
lastmod = [':git', 'lastmod', 'date', 'publishDate']
publishDate = ['publishDate', 'date']

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
codeFences = true
guessSyntax = true
lineNoStart = 1
lineNos = true
lineNumbersInTable = false
tabWidth = 4
noClasses = true
style  = "nord"

[module]
  [[module.mounts]]
  source = "assets"
  target = "assets"

  [[module.mounts]]
  source = "node_modules/"
  target = "assets/node_modules"

  [[module.mounts]]
  source = "static"
  target = "static"
